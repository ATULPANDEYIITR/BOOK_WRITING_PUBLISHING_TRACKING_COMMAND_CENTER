<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookForge | Publishing Command Center</title>

    <meta
        name="description"
        content="Repository-driven book writing and publishing command center."
    >

    <link rel="stylesheet" href="./dashboard/style.css">
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-mark">B</div>
            <div>
                <strong>BOOKFORGE</strong>
                <span>COMMAND CENTER</span>
            </div>
        </div>

        <div class="sidebar-section">
            <span class="sidebar-label">WORKSPACE</span>

            <button class="nav-item active" data-view="overview">
                <span class="nav-icon">◈</span>
                <span>Overview</span>
            </button>

            <button class="nav-item" data-view="categories">
                <span class="nav-icon">▦</span>
                <span>Categories</span>
            </button>

            <button class="nav-item" data-view="books">
                <span class="nav-icon">▤</span>
                <span>Books</span>
            </button>

            <button class="nav-item" data-view="chapters">
                <span class="nav-icon">≡</span>
                <span>Chapters</span>
            </button>

            <button class="nav-item" data-view="pipeline">
                <span class="nav-icon">◇</span>
                <span>Pipeline</span>
            </button>

            <button class="nav-item" data-view="analytics">
                <span class="nav-icon">◒</span>
                <span>Analytics</span>
            </button>

            <button class="nav-item" data-view="attention">
                <span class="nav-icon">!</span>
                <span>Needs Attention</span>
                <span class="nav-count" id="attentionCount">0</span>
            </button>
        </div>

        <div class="sidebar-footer">

            <div class="system-status">
                <span class="status-dot"></span>
                <div>
                    <strong>Repository Connected</strong>
                    <small>Live generated dataset</small>
                </div>
            </div>

            <div class="source-path">
                BOOK_TRACKER/BOOK_MASTER_TRACKER.csv
            </div>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="mobile-brand">
                <div class="brand-mark">B</div>
                <strong>BOOKFORGE</strong>
            </div>

            <div class="topbar-title">
                <span>Digital Publishing Operations</span>
                <strong id="viewTitle">Command Center</strong>
            </div>

            <div class="topbar-actions">

                <div class="data-status">
                    <span class="status-dot"></span>
                    <span id="dataStatus">Loading repository data...</span>
                </div>

                <button class="refresh-button" id="refreshButton">
                    ↻ Refresh
                </button>

            </div>

        </header>

        <div id="content" class="content">

            <section id="loadingScreen" class="loading-screen">
                <div class="loader"></div>
                <h2>Loading publishing intelligence</h2>
                <p>Scanning repository-generated data...</p>
            </section>

        </div>

    </main>

</div>

<div id="modal" class="modal hidden">

    <div class="modal-backdrop" id="modalBackdrop"></div>

    <div class="modal-panel">

        <button class="modal-close" id="modalClose">×</button>

        <div id="modalContent"></div>

    </div>

</div>

<script src="./dashboard/app.js"></script>

</body>
</html>
